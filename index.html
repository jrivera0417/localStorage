<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage - Alamacenamiento Local.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <h2>Ejercicio 1. Guardar un nombre</h2>

        <form action="">
            <label>Nombre:</label>
            <input type="text" id="nombreGuardar">

            <button type="button" onclick="guardarNombre()">Guardar Nombre</button>
        </form>

        <p id="resultadoGuardar"></p>
    </section>
    <section>
        <h2>Ejercicio 2: Mostrar los nombres guardados</h2>

        <form action="">
            <button type="button" onclick="mostrarNombre()">Mostrar Nombres</button>
        </form>

        <p id="resultadoMostrar"></p>
    </section>
    <section>
        <h2>Ejercicio 3: Editar un nombre</h2>

        <label>Posición del nombre:</label>
        <input type="number" id="posicionEditar">

        <label>Nuevo nombre:</label>
        <input type="text" id="nuevoNombre">

        <button type="button" onclick="editarNombre()">
            Editar Nombre
        </button>

        <p id="resultadoEditar"></p>
    </section>
    <section>
        <h2>Ejercicio 4: Eliminar nombres guardados</h2>

        <form action="">
            <label for="posicionEliminar">Posición del nombre que desea eliminar:</label>
            <input type="number" id="posicionEliminar" min="1" step="1">

            <button type="button" onclick="eliminarNombre()">Eliminar por posición</button>
            <button type="button" onclick="eliminarNombre(true)">Eliminar todos</button>
        </form>

        <p id="resultadoEliminar"></p>
    </section>
    <section>
        <h2>Ejercicio 5: Guardar una mascota</h2>

        <form action="">
            <label for="mascota">Mascota:</label>
            <input type="text" id="mascota">

            <label for="raza">Raza:</label>
            <input type="text" id="raza">

            <label for="edad">Edad:</label>
            <input type="number" id="edad" min="0">

            <button type="button" onclick="guardarMascota()">Guardar mascota</button>
        </form>

        <p id="resultadoMascota"></p>
    </section>
    <section>
        <h2>Ejercicio 6: Mostrar la mascota guardada</h2>

        <form action="">
            <button type="button" onclick="mostrarMascota()">Mostrar mascota</button>
        </form>

        <p id="resultadoMostrarMascota"></p>
    </section>

    <script src="app.js"></script>
</body>
</html>
